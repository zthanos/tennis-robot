# Explicit Gazebo MVP runtime source for CollectionRouteConfiguration.
# calibration_artifact is intentionally absent: the caller supplies its path.
schema_version: collection-route/v2
mechanical:
  capture_half_width_m: 0.17
  ball_radius_m: 0.033
  robot_length_m: 0.8
  robot_width_m: 0.6
  funnel_length_m: 0.4
  funnel_width_m: 0.34
  safety_margin_m: 0.05
  # Conservative planning radius.  The hard controller limit remains
  # 1.25 1/m (0.8 m mechanical radius); planning at 1.25 m limits nominal
  # curvature to 0.8 1/m and reserves about 56% for closed-loop correction.
  minimum_turning_radius_m: 1.25
  maximum_curvature_per_m: 1.25
  minimum_entry_m: 0.2
  # Keep approach geometry at the last full-route baseline. Increasing this
  # to 1.9 m reduced pristine frozen-snapshot coverage from 9/10 to 6/10 by
  # turning three otherwise selectable targets into route conflicts.
  minimum_run_in_m: 1.0
  minimum_run_out_m: 0.3
  minimum_mechanical_ball_spacing_m: 0.5
safety:
  static_obstacle_clearance_m: 0.1
  costmap_inflation_m: 0.15
  trajectory_tube_radius_m: 0.2
  progress_window_m: 0.5
  max_parallel_heading_error_rad: 0.2
  collector_start_timeout_s: 2.0
  # The final ball may still be between the entry and confirmation beams when
  # Nav2 reaches the terminal pose. Allow the bounded 1.5–5.0 s intake drain
  # to finish before treating collector shutdown as faulty.
  collector_stop_timeout_s: 6.0
  safety_pause_timeout_s: 10.0
scan:
  # 0.6 (was 1.0): demanding a valid spatial observation at ALL 18 scan headings
  # is fragile — on the distributed sim the RGB/depth sync slop + rotation timing
  # drop a few headings (e.g. 12/18 covered) even though the scan already
  # confirmed enough balls for a route. Require a majority of headings instead;
  # the confirmed tracks still drive planning.
  required_coverage_fraction: 0.6
  # 90 s (was 20): the 360° scan visits 18 headings, each waiting on a
  # perception frame. Distributed (perception + YOLO on the Pi ARM CPU consuming
  # the PC camera over DDS) runs ~3 s/step, so 20 s only covered 6/18 before the
  # wall-clock guard aborted. 90 s clears the full sweep; a fast local run still
  # finishes well under it.
  scan_timeout_s: 90.0
  minimum_confirmation_count: 2
feasibility:
  heading_sample_count: 16
  confidence_multiplier: 2.0
  tracking_lateral_error_bound_m: 0.04
  capture_safety_margin_m: 0.05
  footprint_clearance_radius_m: 0.50
  tangent_activation_distance_m: 0.75
  max_parallel_heading_error_rad: 0.20
  # Boundary recovery deliberately runs the centreline one configured funnel
  # mouth half-width away from a net/fence ball.  The outer cheek then contacts
  # the ball while the canonical 0.50 m swept-disk clearance still protects the
  # chassis and the rest of the route.  Front cheek tips are at y=+/-0.205 m in
  # the URDF; this is a contact experiment, not the nominal capture corridor.
  boundary_recovery_contact_offset_m: 0.205
connector:
  max_connector_length_m: 20.0
  # A second mission can begin with the chassis facing almost directly away
  # from every target.  The former 1.5 rad per-arc cap prohibited the required
  # forward U-turn even though the canonical 1.25 m radius, collision and
  # self-intersection checks all accepted it.  Keep each CSC arc below pi while
  # allowing the bounded two-arc manoeuvre.
  max_connector_arc_angle_rad: 3.0
  max_connector_total_turn_rad: 6.0
  # Connectors used to be generated only at the 1.25 m minimum turning radius, so
  # 76% of the route was motion that could never collect: an arc that tight has a
  # pure-pursuit heading lead near 0.24 rad, well past the capture gate.  Adding
  # gentler radii lets the search choose a sweeping curve that takes balls on the
  # way instead of a tight hop between dedicated straight passes.  1.0 must stay
  # so the original tight geometry remains available.
  sweep_radius_multipliers: [1.0, 3.0, 6.0]
  # lookahead/(2R) is the pure-pursuit heading lead; with a 0.6 m lookahead and the
  # 0.15 rad capture gate this needs R > 2.0 m.  2.5 m keeps margin.
  capture_minimum_turn_radius_m: 2.5
cluster_heuristics:
  # Clustering guides the router; it never decides what is reachable.  Balls
  # within this distance seed the precomputed multi-pass shortcuts (macros) the
  # search may take in one expansion, and bias which successor is expanded
  # first.  Every pass inside a macro stays individually available, so any
  # interleaving of clusters remains reachable.
  cluster_threshold_m: 2.5
  maximum_clusters: 6
  maximum_macro_passes: 4
  # 0 disables macros entirely without changing which routes exist.
  maximum_macro_chains: 24
global_route_search:
  # Expansions are the deterministic budget; maximum_planning_time_s is the
  # safety net behind it.  One expansion is one successor *evaluation*, so the
  # budget buys the same amount of work whatever the pacing below does with it --
  # which is why this reads 600k where the identical behaviour read 150k while
  # the unit was state visits (150k visits x batch 4).  It costs ~3 s on the
  # recorded scan and returns 45.0 m / 14.1 rad.  On slower hardware the wall
  # clock takes over, which costs run-to-run reproducibility but never
  # correctness: the incumbent is whatever was best when time ran out.
  max_search_expansions: 600000
  terminal_run_out_m: 0.5
  connector_nominal_speed_m_s: 0.35
  crossing_nominal_speed_m_s: 0.35
  turn_energy_equivalent_m_per_rad: 0.2
  weight_length: 1.0
  weight_time: 1.0
  weight_curvature: 1.0
  weight_energy: 1.0
  weight_pass_count: 1.0
  # How many successors one visit to a state evaluates before the state returns
  # to the frontier holding the rest.  Nothing is ever discarded; only the pacing
  # changes.  "fixed" uses successor_batch_size verbatim.  "adaptive" derives it
  # from the admitted candidate count; it is implemented and tested but NOT
  # enabled, because at equal work seven layouts of 194-200 candidates each
  # preferred a different batch (4, 16, 64 and ALL) and one of them was
  # non-monotone in it, so candidate count does not predict a useful batch
  # (debug log #61).
  successor_batch_policy: fixed
  successor_batch_size: 4
shared_pass:
  max_shared_pass_balls: 3
  max_shared_pass_candidates: 100
  minimum_mechanical_ball_spacing_m: 0.5
follow_up:
  # One bounded recovery pass: rescan after a clean first route so balls that
  # were pushed, crossed without confirmation, or deferred by route conflicts
  # are planned from their new observed positions.
  enabled: true
  max_total_runs: 2
planning:
  default_execution_profile:
    nominal_speed_mps: 0.35
    min_speed_mps: 0.15
    max_speed_mps: 0.60
    nominal_speed_warning_tolerance_mps: 0.1
    max_acceleration_mps2: 1.0
    max_deceleration_mps2: 1.0
    # 0.8 (was 0.2): the heading-alignment allowance at the entry of a capture
    # segment.  A pass entered from a connector starts with 0.30-0.32 rad of
    # heading error and is still at 0.19-0.24 rad after 0.2 m, so the
    # capture-grade gate fired before the controller could align and aborted
    # every route (debug log #74).  Passes that survived reached 0.02-0.04 rad
    # by 0.5 m, so 0.8 m is sufficient with margin -- and it still ends before
    # the first crossing, which the planner keeps 1.0 m (required_run_in_m)
    # beyond the segment start.  The capture gate itself (max_heading_error_rad
    # 0.15) is unchanged: this moves when it starts applying, not how strict it
    # is.  Transit connectors are unaffected -- the allowance only exists on
    # segments that carry crossings.
    required_entry_m: 0.8
    required_run_in_m: 1.0
    required_run_out_m: 0.3
    # 2.5 (was 1.25): on a connector→crossing transition the pure-pursuit
    # controller's commanded curvature spikes above the 0.8 1/m planned cap for a
    # tick (sibling of the connector_max_heading_error_rad case, #29) and aborted
    # a distributed route with FAILURE_CURVATURE_EXCEEDED (code 9) at ~0.36 m with
    # otherwise-perfect tracking (lateral=heading=0). Crossings are straight
    # (curvature ~0) so the looser limit doesn't affect capture accuracy, and at
    # 0.35 m/s even 2.5 1/m is 0.875 rad/s — well under max_angular_velocity 3.0.
    max_curvature_per_m: 2.5
    # 0.2 (was 0.1): the inner controller gate on cross-track, enforced per
    # sample by the C++ tracking core.  Once execution became map-anchored
    # (#72) this stopped measuring "deviation from a corridor that drifts with
    # the robot" and started measuring the true map-frame error: connectors
    # legitimately reach 0.13 m p90 / 0.21 m max while turning, so 0.10 m
    # aborted 24.6% of samples including straight passes (#74).  At 0.20 m only
    # 0.1% of measured samples exceed it, all on connectors, and it matches the
    # outer executor contract (safety.trajectory_tube_radius_m) which already
    # sat at 0.20 m.  Capture accuracy is unaffected and far tighter: the
    # straight-pass core measures 0.009 m median, 0.043 m max.
    max_lateral_error_m: 0.2
    max_heading_error_rad: 0.15
    allow_reversing: false
    allow_standalone_rotate: false
  # Safety net behind max_search_expansions, not the primary budget: it sits
  # above the ~3.0 s that budget costs on the recorded scan so a run on this
  # hardware ends deterministically at the expansion count rather than at a
  # clock read.  A slower machine will hit this instead and get the best route
  # found by then.
  maximum_planning_time_s: 4.0
  # Raised from 48: the analytic edge-generation gate makes the O(N^2) connector
  # graph cheap enough (~0.5 s at 200 nodes) to keep the candidate variety needed
  # for a full-coverage forward-only route.  At 48 the graph lacked the heading
  # variants to chain more than ~4 balls.  Graph build is bounded by this cap
  # regardless of ball count, so total planning stays under ~1 s.
  maximum_candidate_count: 200
  # Looser heading hard gate on connector (transit) segments. The pure-pursuit
  # controller leads the path tangent by ~lookahead*curvature/2 on connector
  # curves (~0.24 rad at the 0.8 1/m planned cap with a 0.6 m lookahead), which
  # exceeds the capture-grade default gate (0.15 rad) and self-aborts mid-route.
  # Crossings stay straight and keep the tight default gate for capture accuracy.
  connector_max_heading_error_rad: 0.5
  cost_weight_length: 1.0
  cost_weight_time: 1.0
  cost_weight_curvature: 1.0
  cost_weight_energy: 1.0
  cost_weight_passes: 1.0
gazebo_snapshot:
  configuration_id: gazebo-mvp-provisional-planning-safety-v1
  localization_xy_covariance:
    covariance:
      xx: 0.01
      xy: 0.0
      yy: 0.01
  association:
    association_mahalanobis_gate_chi2: 9.0
    min_confirmations: 2
    min_distinct_scan_steps: 2
perception_spatial_validation:
  max_rgb_depth_timestamp_delta_s: 0.05
  max_detection_to_tf_age_s: 0.5
  covariance_psd_relative_tolerance: 1.0e-9
  min_position_covariance_trace_m2: 1.0e-6
  max_position_covariance_trace_m2: 1.0
