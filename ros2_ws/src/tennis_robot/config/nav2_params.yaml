# Nav2 parameters — tennis robot (differential drive, SLAM-based).
#
# Used with slam_toolbox (map -> odom) for autonomous survey and, later, for
# NavigateToPose ball collection. Controller output is remapped to /cmd_vel_nav
# so twist_mux arbitrates it (see launch/navigation.launch.py).
#
# Robot footprint ~0.92 x 0.58 m (half extents 0.46 x 0.29).

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: true
    # Publish TwistStamped on cmd_vel (remapped to /cmd_vel_nav). twist_mux runs
    # in stamped mode on Jazzy, so a plain Twist here (the Nav2 default) is a
    # type mismatch the DDS graph silently drops — the robot never moves under
    # Nav2 even though the planner keeps handing paths to the controller.
    enable_stamped_cmd_vel: true
    # The raw Gazebo /odom bridge does not carry the fused body velocity used
    # by the collection profile checks.  Keep pose and speed feedback on the
    # same filtered odometry stream as the rest of the navigation stack.
    odom_topic: /odometry/filtered
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker", "collection_goal_checker"]
    controller_plugins: ["FollowPath", "CollectionFollowPath"]

    progress_checker:
      # Count meaningful in-place rotation as progress. The previous
      # translation-only checker aborted long turns between route stops after
      # 10 s even while the robot was rotating toward a valid path.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.5
      required_movement_angle: 0.15
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      # Lane waypoints do not need a specific final heading; a tight yaw
      # tolerance made the robot spin in place at each lane end. Ignore yaw.
      yaw_goal_tolerance: 3.14
      stateful: true

    collection_goal_checker:
      plugin: "tennis_robot_collection_controller::CollectionProgressGoalChecker"
      # The collection controller stops at the context terminal progress. In
      # Gazebo the chassis can settle about 0.22 m beyond that projection after
      # the command reaches zero. The route includes a separate 0.5 m terminal
      # run-out, so 0.30 m closes the action without weakening lane navigation.
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 3.14
      # Euclidean proximity is not sufficient for loop routes: they can pass
      # arbitrarily close to their endpoint at an earlier path position. The
      # checker also consumes the collection controller's canonical progress
      # heartbeat and requires its terminal condition.
      progress_tolerance_m: 0.30
      controller_state_topic: "CollectionFollowPath/state"
      state_timeout_s: 0.50

    # Regulated Pure Pursuit — robust for differential drive.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.6
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.35
      allow_reversing: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 2.0
      max_robot_pose_search_dist: 10.0

    # Collection-only controller. Execution tuning and profiles arrive through
    # the immutable CollectionExecutionContext; this block deliberately has no
    # fallback motion/profile parameters.
    CollectionFollowPath:
      plugin: "tennis_robot_collection_controller::CollectionNav2Controller"

# Collection route executor node (Phase 6C.2+). controller_tuning is
# controller-runtime config, NOT part of the frozen plan: the Python follower
# reads these 5 params (read_controller_tuning) and passes them to the 6B
# CollectionExecutionContext builder. All must be > 0 (matches C++ valid_tuning).
collection_route_executor:
  ros__parameters:
    use_sim_time: true
    # A 0.4 m target was too close to the 0.228 m Dubins polyline samples:
    # small tracking transients could request 1.33 1/m on a planned 1.0 1/m
    # arc.  The longer target smooths that discretisation while the separate
    # path-heading gate still enforces alignment at collection crossings.
    collection_controller_tuning.lookahead_distance_m: 0.6
    collection_controller_tuning.max_angular_velocity_rad_s: 3.0
    collection_controller_tuning.progress_projection_window_m: 10.0
    collection_controller_tuning.crossing_speed_window_m: 0.25
    collection_controller_tuning.terminal_progress_tolerance_m: 0.30
    # Phase 6D.3 node-side executor configuration. Every value is required by
    # CollectionExecutorNodeFactory; there are deliberately no code defaults.
    collection_route.context_schema_version: "collection-execution-context/v1"
    collection_route.context_activation_timeout_s: 10.0
    # RGB HFOV is 69 deg, but far balls rely on the tiled neural region whose
    # validated effective half-angle is about 26.5 deg.  The snapshot requires
    # two distinct headings: 18 steps (20 deg spacing) guarantee that a target
    # seen near one heading is also inside an adjacent tiled-neural view.
    collection_route.scan_step_count: 18
    collection_route.scan_yaw_tolerance_rad: 0.10
    collection_route.scan_start_yaw_rad: 0.0
    collection_route.scan_angular_speed_rad_s: 0.50
    collection_route.scan_timeout_s: 20.0
    collection_route.safety_forward_half_angle_rad: 0.35
    collection_route.safety_stop_distance_m: 0.60
    collection_route.safety_pause_timeout_s: 10.0
    collection_route.safety_max_scan_age_s: 0.50
    collection_route.controller_id: "CollectionFollowPath"
    collection_route.goal_checker_id: "collection_goal_checker"
    # Off-route discovery while driving a route. A "viewpoint" is the drive's
    # equivalent of a scan heading, so the snapshot's two-distinct-steps rule
    # requires a ball to be seen from two places 0.75 m apart before it is
    # trusted — a metres-long baseline rather than a 20 deg one.
    collection_route.drive_viewpoint_spacing_m: 0.75
    # A discovery this close to a target the finished route already knew about
    # is the same ball, not a new one.
    collection_route.drive_known_merge_radius_m: 0.50

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.46, 0.29], [0.46, -0.29], [-0.46, -0.29], [-0.46, 0.29]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.46, 0.29], [0.46, -0.29], [-0.46, -0.29], [-0.46, 0.29]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 10.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # Smac2D (A*-based) is more robust than NavFn Dijkstra in unknown/sparse
      # SLAM costmaps.  NavFn Dijkstra produces "Failed to create a plan from
      # potential" errors when the gradient field can't be extracted — Smac avoids
      # this by using a proper A* search with a valid path guarantee.
      # Humble's pluginlib export uses the slash-qualified class name.
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.5
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    use_sim_time: true
    # Recovery behaviors (spin/backup/drive_on_heading) publish cmd_vel too —
    # same stamped-mux requirement as controller_server above.
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    simulate_ahead_time: 2.0
    # Slow spin: less wheel slip → odom more accurate → SLAM drift reduced.
    # At 0.25 rad/s, 90° takes ~6s (Spin behavior does closed-loop with odom).
    max_rotational_vel: 0.25
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.5
