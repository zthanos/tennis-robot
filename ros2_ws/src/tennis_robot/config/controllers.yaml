# ros2_control controller configuration for the tennis robot.
#
# Loaded by the gz_ros2_control-system plugin (sim) or a standalone
# controller_manager node (real robot). These names/params are the stable
# contract the behavior stack targets — identical for sim and hardware.
#
# Controllers:
#   joint_state_broadcaster      -> publishes /joint_states (+ feeds /tf via RSP)
#   diff_drive_controller        -> /diff_drive_controller/cmd_vel_unstamped (Twist) -> wheels, publishes odom + tf
#   intake_wheel_velocity_controller -> /intake_wheel_velocity_controller/commands
#     (Float64MultiArray [left, right]) -> dual-wheel intake. Forward intake
#     is [-v, +v]: left wheel clockwise / right counter-clockwise (top view)
#     so both inner faces drive rearward (-x).
#   assist_wheel_velocity_controller -> /assist_wheel_velocity_controller/commands
#     (Float64MultiArray [v]) -> optional ramp assist roller. Forward assist is
#     +v: bottom surface drives rearward (-x).
#   conveyor_velocity_controller -> /conveyor_velocity_controller/commands
#     (Float64MultiArray [front, mid, rear]) -> Phase 3B ramp conveyor
#     approximation with three small powered rollers.

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    intake_wheel_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    assist_wheel_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    conveyor_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    flywheel_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    basket_velocity_controller:
      type: forward_command_controller/ForwardCommandController
    launcher_tilt_velocity_controller:
      type: forward_command_controller/ForwardCommandController

diff_drive_controller:
  ros__parameters:
    # 4WD skid-steer: two driven wheels per side, both commanded together.
    left_wheel_names: ["rear_left_wheel_joint", "front_left_wheel_joint"]
    right_wheel_names: ["rear_right_wheel_joint", "front_right_wheel_joint"]

    # Geometry — keep in sync with urdf/tennis_robot.urdf.xacro
    # P2-99c (c): v3 chassis, geometric track 2 * 0.297 = 0.594 m, wheelbase
    # 0.365 m. Skid-steer scrub makes the EFFECTIVE rotational track differ
    # from the geometric one. Calibrated in Gazebo (P2-99c gyro turn test,
    # scripts/sim_debug/p299c_gyro_check.py): with 0.849 a 0.600 rad/s command
    # gave 0.693 rad/s on the gyro -> effective 0.849 * 0.600 / 0.693 = 0.735
    # (1.24 x geometric). Yaw itself is fused from the IMU gyro only
    # (ekf.yaml), not from wheel odometry. Re-calibrate on the real robot.
    wheel_separation: 0.735
    wheel_radius: 0.085  # 170 mm HPI Dirt Buster Block wheels (was 0.09 / 180 mm)

    # Plain geometry_msgs/Twist on ~/cmd_vel_unstamped (use_stamped_vel: false)
    use_stamped_vel: false
    # NOTE: must stay < ~2.1e6 s. The controller computes
    # static_cast<int>(timeout * 1000) ms — larger values overflow int32 to a
    # NEGATIVE timeout, so every command is treated as expired and zeroed
    # (robot accepts Twist but never moves). The old 1.0e9 hit exactly this.
    cmd_vel_timeout: 5.0

    publish_rate: 50.0
    # Diagnostic tap: republishes the command as the controller processed it
    # on ~/cmd_vel_out. Shows whether messages actually reach the controller.
    publish_limited_velocity: true
    odom_frame_id: odom
    # base_footprint (not base_link): the URDF already publishes
    # base_footprint -> base_link via robot_state_publisher. Pointing odom at
    # base_link would give base_link two TF parents and orphan base_footprint.
    # Chain: map -> odom -> base_footprint -> base_link
    base_frame_id: base_footprint
    # EKF (robot_localization) now publishes odom -> base_footprint by fusing
    # this odometry with the IMU. diff_drive still publishes the /odom TOPIC
    # (consumed by the EKF) but must NOT also broadcast the TF, or it fights the
    # EKF for the same transform.
    enable_odom_tf: false
    open_loop: false

    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]

    # Velocity/acceleration limits — DISABLED for now. With only max (no min) set,
    # the limiter could clamp the output to 0 under sim time. Re-enable later with
    # matching min_velocity / min_acceleration values.
    linear.x.has_velocity_limits: false
    linear.x.has_acceleration_limits: false
    angular.z.has_velocity_limits: false
    angular.z.has_acceleration_limits: false

intake_wheel_velocity_controller:
  ros__parameters:
    joints: ["intake_wheel_left_joint", "intake_wheel_right_joint"]
    interface_name: velocity

assist_wheel_velocity_controller:
  ros__parameters:
    joints: ["intake_assist_wheel_joint"]
    interface_name: velocity

conveyor_velocity_controller:
  ros__parameters:
    joints: ["intake_conveyor_front_joint", "intake_conveyor_mid_joint", "intake_conveyor_rear_joint"]
    interface_name: velocity

flywheel_velocity_controller:
  ros__parameters:
    # Forward launch: left positive, right negative. The controller exposes
    # the two raw wheel commands so differential spin remains possible later.
    joints: ["flywheel_left_joint", "flywheel_right_joint"]
    interface_name: velocity

launcher_tilt_velocity_controller:
  ros__parameters:
    # P2-99c (d1b): shared-flywheel tilt, rated-speed primitive (+-0.09 rad/s);
    # the -3 / +20 deg seats are joint limits, the position loop is closed by
    # the supervisor from /joint_states (AS5600 on hardware).
    joints: ["launcher_tilt_joint"]
    interface_name: velocity

basket_velocity_controller:
  ros__parameters:
    joints: ["basket_joint"]
    # The actuator primitive is a rated-speed drive; domain commands are still
    # target positions, and RosService.set_basket_position closes that loop from
    # /joint_states, stopping the carriage at the lowered/raised endpoint. A
    # position command interface is deliberately NOT used: gz_ros2_control
    # emulates one with an unsaturated proportional controller that ignores the
    # joint's rated speed. The name states the interface, so the supervisor
    # boundary stays visible to whoever writes the physical actuator driver.
    interface_name: velocity
