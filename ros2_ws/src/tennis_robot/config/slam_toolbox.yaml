# slam_toolbox (online async) — court mapping.
#
# Reads /scan + odom/TF (from ros2_control) and publishes map + map->odom TF.
# Tuned for an RPLIDAR C1 on a mostly open tennis court: the perimeter fence is
# the main feature, so we lean on wheel odometry as a strong prior and keep loop
# closure conservative to avoid false matches in the featureless interior.

slam_toolbox:
  ros__parameters:
    # ── Plugins ──────────────────────────────────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ── Frames / topics (match the sensor contract) ──────────────────────────
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_sim_time: true            # set false on the real robot

    mode: mapping                 # mapping | localization

    # ── Rates ────────────────────────────────────────────────────────────────
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02   # 50 Hz map->odom
    map_update_interval: 1.0
    resolution: 0.05
    max_laser_range: 12.0            # RPLIDAR C1 usable range
    minimum_time_between_scans: 0.2
    minimum_travel_distance: 0.3
    # 0.15 rad (~8.6°): more scans during turns so the matcher can track
    # heading. At 0.3 rad the map broke (rotated submap) after fast rotations.
    minimum_travel_heading: 0.15
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # ── Scan matching ────────────────────────────────────────────────────────
    use_scan_matching: true
    use_scan_barycenter: true
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # ── Loop closure ─────────────────────────────────────────────────────────
    # DISABLED: the court is nearly symmetric (identical fences on all sides,
    # few distinctive features), so loop closure can match the WRONG wall and
    # rotate the whole map. Odometry + scan matching alone are sufficient for
    # a single 33x17 m enclosure.
    do_loop_closing: false
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ── Correlation search ───────────────────────────────────────────────────
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ── Penalties ────────────────────────────────────────────────────────────
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
