<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Motion control board wiring</title>
<desc>Motion control board: high-current 12V power chain (battery, fuse, relay contacts, distribution) off the perfboard feeding two BTS7960 drivers and four motors. The E-stop and main switch control only the relay coil. The Arduino Mega via the perfboard sends PWM/EN, receives encoders, and talks I2C to the MPU-6050 gyro.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th{font:500 14px sans-serif}.ts{font:400 12px sans-serif}
.r{fill:#FCEBEB;stroke:#A32D2D}.rt{fill:#791F1F}
.g{fill:#F1EFE8;stroke:#5F5E5A}.gt{fill:#2C2C2A}
.tl{fill:#E1F5EE;stroke:#0F6E56}.tlt{fill:#085041}
.bl{fill:#E6F1FB;stroke:#185FA5}.blt{fill:#0C447C}
.pu{fill:#EEEDFE;stroke:#534AB7}.put{fill:#3C3489}
.arr{stroke-width:1.5;fill:none}
</style>
</defs>

<rect x="46" y="22" width="13" height="13" rx="3" fill="#E24B4A"/><text class="ts" x="64" y="32" fill="#5F5E5A">12V power (off-board)</text>
<rect x="214" y="22" width="13" height="13" rx="3" fill="#378ADD"/><text class="ts" x="232" y="32" fill="#5F5E5A">logic / PWM</text>
<rect x="330" y="22" width="13" height="13" rx="3" fill="#1D9E75"/><text class="ts" x="348" y="32" fill="#5F5E5A">encoders</text>
<rect x="446" y="22" width="13" height="13" rx="3" fill="#7F77DD"/><text class="ts" x="464" y="32" fill="#5F5E5A">I2C gyro</text>

<line x1="146" y1="83" x2="166" y2="83" class="arr" stroke="#E24B4A" marker-end="url(#arrow)"/>
<line x1="268" y1="83" x2="288" y2="83" class="arr" stroke="#E24B4A" marker-end="url(#arrow)"/>
<line x1="390" y1="83" x2="410" y2="83" class="arr" stroke="#E24B4A" marker-end="url(#arrow)"/>
<line x1="512" y1="83" x2="532" y2="83" class="arr" stroke="#E24B4A" marker-end="url(#arrow)"/>

<g><rect class="r" x="46" y="60" width="100" height="46" rx="6"/><text class="th rt" x="96" y="82" text-anchor="middle">12V battery</text><text class="ts rt" x="96" y="98" text-anchor="middle">LiFePO4</text></g>
<g><rect class="r" x="168" y="60" width="100" height="46" rx="6"/><text class="th rt" x="218" y="82" text-anchor="middle">Main fuse</text><text class="ts rt" x="218" y="98" text-anchor="middle">20A blade</text></g>
<g><rect class="r" x="290" y="60" width="100" height="46" rx="6"/><text class="th rt" x="340" y="82" text-anchor="middle">Relay 30→87</text><text class="ts rt" x="340" y="98" text-anchor="middle">40A contacts</text></g>
<g><rect class="r" x="412" y="60" width="100" height="46" rx="6"/><text class="th rt" x="462" y="82" text-anchor="middle">Power dist</text><text class="ts rt" x="462" y="98" text-anchor="middle">12V / GND</text></g>
<g><rect class="r" x="534" y="60" width="100" height="46" rx="6"/><text class="th rt" x="584" y="82" text-anchor="middle">B+ split</text><text class="ts rt" x="584" y="98" text-anchor="middle">left / right</text></g>

<path d="M584 106 L195 170" class="arr" stroke="#E24B4A" marker-end="url(#arrow)"/>
<path d="M584 106 L485 170" class="arr" stroke="#E24B4A" marker-end="url(#arrow)"/>

<g><rect class="g" x="110" y="170" width="170" height="50" rx="6"/><text class="th gt" x="195" y="194" text-anchor="middle">Left BTS7960</text><text class="ts gt" x="195" y="210" text-anchor="middle">left pair</text></g>
<g><rect class="g" x="400" y="170" width="170" height="50" rx="6"/><text class="th gt" x="485" y="194" text-anchor="middle">Right BTS7960</text><text class="ts gt" x="485" y="210" text-anchor="middle">right pair</text></g>

<path d="M195 220 L117 300" class="arr" stroke="#888780" marker-end="url(#arrow)"/>
<path d="M195 220 L247 300" class="arr" stroke="#888780" marker-end="url(#arrow)"/>
<path d="M485 220 L432 300" class="arr" stroke="#888780" marker-end="url(#arrow)"/>
<path d="M485 220 L562 300" class="arr" stroke="#888780" marker-end="url(#arrow)"/>

<g><rect class="tl" x="60" y="300" width="115" height="46" rx="6"/><text class="th tlt" x="117" y="322" text-anchor="middle">LF motor</text><text class="ts tlt" x="117" y="338" text-anchor="middle">+ encoder</text></g>
<g><rect class="tl" x="190" y="300" width="115" height="46" rx="6"/><text class="th tlt" x="247" y="322" text-anchor="middle">LR motor</text><text class="ts tlt" x="247" y="338" text-anchor="middle">+ encoder</text></g>
<g><rect class="tl" x="375" y="300" width="115" height="46" rx="6"/><text class="th tlt" x="432" y="322" text-anchor="middle">RF motor</text><text class="ts tlt" x="432" y="338" text-anchor="middle">+ encoder</text></g>
<g><rect class="tl" x="505" y="300" width="115" height="46" rx="6"/><text class="th tlt" x="562" y="322" text-anchor="middle">RR motor</text><text class="ts tlt" x="562" y="338" text-anchor="middle">+ encoder</text></g>

<path d="M340 415 L340 250" class="arr" stroke="#378ADD"/>
<path d="M340 250 L197 222" class="arr" stroke="#378ADD" marker-end="url(#arrow)"/>
<path d="M340 250 L483 222" class="arr" stroke="#378ADD" marker-end="url(#arrow)"/>

<path d="M117 346 L268 414" stroke="#1D9E75" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M247 346 L300 414" stroke="#1D9E75" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M432 346 L382 414" stroke="#1D9E75" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M562 346 L410 414" stroke="#1D9E75" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<g><rect class="bl" x="55" y="415" width="160" height="50" rx="6"/><text class="th blt" x="135" y="439" text-anchor="middle">Arduino Mega</text><text class="ts blt" x="135" y="455" text-anchor="middle">motion MCU</text></g>
<g><rect class="bl" x="255" y="415" width="170" height="50" rx="6"/><text class="th blt" x="340" y="439" text-anchor="middle">Perfboard</text><text class="ts blt" x="340" y="455" text-anchor="middle">logic + headers J1-J9</text></g>
<g><rect class="pu" x="465" y="415" width="135" height="50" rx="6"/><text class="th put" x="532" y="439" text-anchor="middle">MPU-6050</text><text class="ts put" x="532" y="455" text-anchor="middle">gyro (J9, I2C)</text></g>

<line x1="215" y1="440" x2="253" y2="440" class="arr" stroke="#378ADD" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="465" y1="440" x2="427" y2="440" class="arr" stroke="#7F77DD" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<path d="M340 465 L340 500" class="arr" stroke="#378ADD" marker-end="url(#arrow)"/>
<g><rect class="g" x="255" y="500" width="170" height="42" rx="6"/><text class="th gt" x="340" y="520" text-anchor="middle">Start / Arm button</text><text class="ts gt" x="340" y="535" text-anchor="middle">to Mega D32</text></g>
</svg>
