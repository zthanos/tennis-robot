<svg width="100%" viewBox="0 0 680 530" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Motion perfboard header pinout</title>
<desc>Perfboard headers J1-J9: each component plugs into a header; pins are colour-coded by signal type. VCC/5V pins join the top 5V rail, GND pins join the bottom GND rail.</desc>
<style>.ti{font:500 13px sans-serif;fill:#2C2C2A}.pn{font:400 12px sans-serif;fill:#444441}.lg{font:400 12px sans-serif;fill:#5F5E5A}.card{fill:#FFFFFF;stroke:#D3D1C7}.tb{fill:#F1EFE8;stroke:#D3D1C7}</style>
