<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Collector Linux Control Diagram</title>
  <desc id="desc">Block diagram showing Linux PC control over USB serial to Arduino Nano, TB6612FNG motor driver, 12V supply, collector motor, encoder pulses, and two IR break beam sensors.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05214a"/>
      <stop offset="0.52" stop-color="#06356f"/>
      <stop offset="1" stop-color="#031936"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00122b" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#ffffff"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#7fe7ff"/>
    </marker>
    <style>
      .frame { fill: none; stroke: #f1f7ff; stroke-width: 5; }
      .box { fill: rgba(9, 49, 99, 0.86); stroke: #eaf5ff; stroke-width: 4; filter: url(#softShadow); }
      .subbox { fill: rgba(15, 67, 126, 0.88); stroke: #d8efff; stroke-width: 3; }
      .label { font-family: "Segoe UI", Arial, sans-serif; fill: #f7fbff; font-size: 28px; font-weight: 700; }
      .small { font-family: "Segoe UI", Arial, sans-serif; fill: #e7f4ff; font-size: 21px; font-weight: 600; }
      .tiny { font-family: "Segoe UI", Arial, sans-serif; fill: #cde9ff; font-size: 17px; font-weight: 500; }
      .wire { fill: none; stroke: #ffffff; stroke-width: 5; marker-end: url(#arrow); }
      .wireThin { fill: none; stroke: #ffffff; stroke-width: 4; marker-end: url(#arrow); }
      .wireCyan { fill: none; stroke: #7fe7ff; stroke-width: 5; marker-end: url(#arrowCyan); }
      .wireAmber { fill: none; stroke: #ffcc66; stroke-width: 5; marker-end: url(#arrow); }
      .return { fill: none; stroke: #d8efff; stroke-width: 4; marker-end: url(#arrow); }
      .rail { fill: none; stroke: #7fe7ff; stroke-width: 3; stroke-dasharray: 9 9; }
      .motor { fill: rgba(9, 49, 99, 0.86); stroke: #eaf5ff; stroke-width: 5; filter: url(#softShadow); }
      .battery { fill: rgba(9, 49, 99, 0.86); stroke: #eaf5ff; stroke-width: 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="780" fill="url(#bg)"/>
  <rect x="28" y="28" width="1344" height="724" class="frame"/>

  <!-- Linux host -->
  <rect x="115" y="298" width="245" height="150" rx="12" class="box"/>
  <text x="142" y="340" class="label">Linux PC</text>
  <text x="142" y="374" class="small">ROS 2 / Python</text>
  <rect x="168" y="392" width="140" height="72" rx="10" class="subbox"/>
  <text x="196" y="424" class="small">Collector</text>
  <text x="212" y="452" class="small">Node</text>

  <!-- Arduino -->
  <rect x="510" y="318" width="170" height="112" rx="12" class="box"/>
  <text x="545" y="360" class="small">Arduino</text>
  <text x="562" y="389" class="small">Nano</text>
  <text x="540" y="416" class="tiny">Motor controller</text>

  <!-- Driver -->
  <rect x="820" y="318" width="175" height="112" rx="12" class="box"/>
  <text x="856" y="357" class="small">TB6612FNG</text>
  <text x="864" y="386" class="small">Motor Driver</text>
  <text x="865" y="414" class="tiny">VM + VCC + GND</text>

  <!-- Motor -->
  <g transform="translate(1160 328)">
    <path class="motor" d="M 0 20 C 0 8 9 0 21 0 L 132 0 C 171 0 198 25 198 56 C 198 87 171 112 132 112 L 21 112 C 9 112 0 104 0 92 Z"/>
    <ellipse cx="132" cy="56" rx="38" ry="56" fill="none" stroke="#eaf5ff" stroke-width="5"/>
    <line x1="198" y1="56" x2="250" y2="56" stroke="#eaf5ff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="1155" y="280" class="small">GB37Y3530</text>
  <text x="1155" y="309" class="small">12V Collector Motor</text>

  <!-- Battery / PSU -->
  <g transform="translate(835 108)">
    <text x="22" y="-18" class="small">12V PSU / Battery</text>
    <rect x="42" y="0" width="150" height="58" rx="8" class="battery"/>
    <rect x="192" y="18" width="14" height="22" rx="3" class="battery"/>
    <text x="64" y="38" class="small">-</text>
    <text x="160" y="38" class="small">+</text>
  </g>

  <!-- IR sensors -->
  <rect x="455" y="570" width="205" height="72" rx="12" class="box"/>
  <text x="486" y="601" class="small">IR Beam #1</text>
  <text x="495" y="628" class="tiny">Entrance / D9</text>

  <rect x="700" y="570" width="205" height="72" rx="12" class="box"/>
  <text x="733" y="601" class="small">IR Beam #2</text>
  <text x="724" y="628" class="tiny">Exit / D10</text>

  <!-- Control arrows -->
  <line x1="360" y1="374" x2="510" y2="374" class="wireCyan"/>
  <text x="382" y="352" class="small">Serial over USB</text>

  <line x1="680" y1="360" x2="820" y2="360" class="wire"/>
  <text x="704" y="336" class="small">5V PWM</text>
  <text x="700" y="388" class="tiny">PWMA, AIN1, AIN2, STBY</text>

  <line x1="995" y1="374" x2="1160" y2="374" class="wire"/>
  <text x="1035" y="349" class="small">12V PWM</text>
  <text x="1032" y="407" class="tiny">AO1 / AO2</text>

  <!-- Power arrows -->
  <line x1="952" y1="166" x2="952" y2="318" class="wireAmber"/>
  <text x="970" y="245" class="small">+12V to VM</text>
  <line x1="900" y1="166" x2="900" y2="318" class="rail"/>
  <text x="775" y="245" class="tiny">GND common</text>

  <!-- Encoder return path -->
  <path d="M 1286 440 L 1286 522 L 595 522 L 595 430" class="return"/>
  <text x="790" y="502" class="small">Encoder pulses</text>
  <text x="803" y="531" class="tiny">A: D2, B: D7</text>

  <!-- IR to Arduino -->
  <path d="M 558 570 L 558 488 L 572 430" class="wireThin"/>
  <path d="M 802 570 L 802 488 L 624 430" class="wireThin"/>
  <text x="466" y="548" class="tiny">ball enters collector</text>
  <text x="708" y="548" class="tiny">ball reaches exit</text>

  <!-- 5V/GND note -->
  <rect x="120" y="605" width="260" height="78" rx="12" class="subbox"/>
  <text x="143" y="635" class="small">Common ground</text>
  <text x="143" y="663" class="tiny">Linux USB, Nano, TB6612,</text>
  <text x="143" y="686" class="tiny">12V PSU, encoder, IR sensors</text>
</svg>
