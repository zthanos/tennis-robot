<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img">
  <title>Current 4WD chassis and dual-wheel intake layout</title>
  <desc>Current mechanical baseline: level 920 by 580 millimetre chassis, four 170 by 80 millimetre driven wheels with two per side and no casters, dual vertical-axis intake wheels, central removable basket, battery, electronics, lidar and OAK-D.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#237a49"/></marker>
    <marker id="dim-arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto-start-reverse"><path d="M0,0 L0,6 L6,3 z" fill="#2463a3"/></marker>
    <style>
      .bg{fill:#f5f4ef}.panel{fill:#fffefa;stroke:#c9c5bc;stroke-width:2}.title{font-family:Arial,sans-serif;font-size:36px;font-weight:700;fill:#171717}.subtitle{font-family:Arial,sans-serif;font-size:19px;fill:#3c3c3a}.h{font-family:Arial,sans-serif;font-size:24px;font-weight:700;fill:#171717}.label{font-family:Arial,sans-serif;font-size:17px;font-weight:700;fill:#202020}.small{font-family:Arial,sans-serif;font-size:15px;fill:#343432}.tiny{font-family:Arial,sans-serif;font-size:13px;fill:#454542}.chassis{fill:#c7d0d6;stroke:#20252a;stroke-width:3}.wheel{fill:#171a1e;stroke:#050607;stroke-width:3}.hub{fill:#b58b42;stroke:#4e3a19;stroke-width:2}.motor{fill:#68737c;stroke:#252b30;stroke-width:2}.basket{fill:#75bd8c;fill-opacity:.65;stroke:#216a3a;stroke-width:3}.battery{fill:#555e66;stroke:#22282d;stroke-width:2}.electronics{fill:#8ab6d6;stroke:#28597b;stroke-width:2}.intake{fill:#ecb341;stroke:#76520c;stroke-width:3}.funnel{fill:#f4d889;fill-opacity:.72;stroke:#9b6f17;stroke-width:3}.sensor{fill:#7d6db2;stroke:#3d3269;stroke-width:2}.center{stroke:#696966;stroke-width:1.5;stroke-dasharray:9 7}.dim{stroke:#2463a3;stroke-width:2;marker-start:url(#dim-arrow);marker-end:url(#dim-arrow)}.flow{stroke:#237a49;stroke-width:5;fill:none;marker-end:url(#arrow)}.note{fill:#f3f1e9;stroke:#bab5aa;stroke-width:1.5}.danger{fill:#fff1e8;stroke:#c15e25;stroke-width:2}.rail{fill:#dbe0e3;stroke:#5c646b;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="980" class="bg"/>
  <text x="48" y="58" class="title">Τρέχουσα μηχανολογική αρχιτεκτονική</text>
  <text x="50" y="91" class="subtitle">4WD skid-steer · δύο κινητήριοι τροχοί ανά πλευρά · χωρίς casters · dual-wheel side-pinch intake · basket v2.1</text>

  <rect x="35" y="120" width="990" height="655" rx="12" class="panel"/>
  <text x="65" y="160" class="h">Κάτοψη — robot +x προς τα εμπρός</text>
  <!-- scale 0.65 px/mm, chassis 920 x 580 -->
  <g transform="translate(140,225)">
    <rect x="0" y="0" width="598" height="377" rx="10" class="chassis"/>
    <line x1="-35" y1="188.5" x2="805" y2="188.5" class="center"/>
    <text x="12" y="181" class="tiny">centreline y=0</text>
    <text x="273" y="370" class="tiny">level chassis plate 920 × 580 mm</text>

    <!-- four drive wheels: axle x ±330 mm, wheel y ±350 mm -->
    <rect x="30" y="-65" width="111" height="52" rx="18" class="wheel"/><circle cx="85.5" cy="-39" r="13" class="hub"/>
    <rect x="458" y="-65" width="111" height="52" rx="18" class="wheel"/><circle cx="513.5" cy="-39" r="13" class="hub"/>
    <rect x="30" y="390" width="111" height="52" rx="18" class="wheel"/><circle cx="85.5" cy="416" r="13" class="hub"/>
    <rect x="458" y="390" width="111" height="52" rx="18" class="wheel"/><circle cx="513.5" cy="416" r="13" class="hub"/>
    <rect x="55" y="-9" width="61" height="28" rx="6" class="motor"/><rect x="483" y="-9" width="61" height="28" rx="6" class="motor"/>
    <rect x="55" y="358" width="61" height="28" rx="6" class="motor"/><rect x="483" y="358" width="61" height="28" rx="6" class="motor"/>
    <text x="17" y="42" class="small">rear-left 170×80</text><text x="447" y="42" class="small">front-left 170×80</text>
    <text x="17" y="466" class="small">rear-right 170×80</text><text x="445" y="466" class="small">front-right 170×80</text>

    <rect x="152" y="128" width="108" height="128" rx="8" class="battery"/>
    <text x="173" y="184" class="label" fill="#fff">Battery</text><text x="166" y="207" class="tiny" fill="#fff">low / central</text>
    <rect x="45" y="88" width="92" height="72" rx="8" class="electronics"/>
    <text x="58" y="118" class="small">Mega +</text><text x="53" y="139" class="small">perfboard</text>
    <rect x="45" y="220" width="92" height="72" rx="8" class="electronics"/>
    <text x="58" y="250" class="small">BTS7960</text><text x="58" y="271" class="small">×2 + relay</text>

    <!-- basket interior x 20..420 mm, y ±140 mm -->
    <rect x="312" y="97.5" width="260" height="182" rx="8" class="basket"/>
    <text x="368" y="178" class="label">Basket v2.1</text><text x="354" y="201" class="small">removable · 400 × 280</text>
    <rect x="546" y="130" width="58" height="117" rx="5" class="rail"/><text x="548" y="260" class="tiny">entry hood</text>

    <!-- dual vertical-axis intake wheels and funnel -->
    <path d="M598 55 L790 112 L790 265 L598 322 Z" class="funnel"/><text x="650" y="78" class="small">funnel cheeks</text>
    <g transform="rotate(35 650 131)"><rect x="611" y="111" width="78" height="40" rx="18" class="intake"/></g>
    <g transform="rotate(-35 650 246)"><rect x="611" y="226" width="78" height="40" rx="18" class="intake"/></g>
    <circle cx="650" cy="131" r="9" class="hub"/><circle cx="650" cy="246" r="9" class="hub"/>
    <text x="675" y="133" class="small">left intake wheel</text><text x="675" y="250" class="small">right intake wheel</text>
    <path d="M810 188 C755 188 704 188 646 188 C620 188 594 188 566 188" class="flow"/>
    <text x="694" y="179" class="tiny">ball capture → basket</text>

    <circle cx="26" cy="188" r="18" class="sensor"/><text x="5" y="218" class="tiny">RPLIDAR mast</text>
    <rect x="565" y="45" width="26" height="72" rx="5" class="sensor"/><text x="548" y="36" class="tiny">OAK-D</text>

    <line x1="0" y1="500" x2="598" y2="500" class="dim"/><text x="270" y="525" class="small">920 mm chassis</text>
    <line x1="-72" y1="0" x2="-72" y2="377" class="dim"/><text x="-118" y="198" transform="rotate(-90 -118 198)" class="small">580 mm chassis</text>
    <line x1="85.5" y1="65" x2="513.5" y2="65" class="dim"/><text x="272" y="58" class="tiny">660 mm wheelbase</text>
  </g>

  <rect x="1050" y="120" width="515" height="655" rx="12" class="panel"/>
  <text x="1080" y="160" class="h">Πλάγια όψη και επίπεδα</text>
  <g transform="translate(1090,225)">
    <rect x="0" y="410" width="435" height="24" fill="#c8a27b" opacity=".55"/>
    <rect x="25" y="355" width="350" height="14" class="chassis"/>
    <circle cx="80" cy="355" r="55" class="wheel"/><circle cx="80" cy="355" r="14" class="hub"/>
    <circle cx="322" cy="355" r="55" class="wheel"/><circle cx="322" cy="355" r="14" class="hub"/>
    <rect x="135" y="252" width="142" height="103" rx="5" class="basket"/>
    <path d="M277 330 L390 330 L425 365 L322 365 Z" class="funnel"/><ellipse cx="375" cy="340" rx="31" ry="22" class="intake"/>
    <rect x="102" y="292" width="62" height="63" rx="5" class="battery"/>
    <line x1="45" y1="355" x2="45" y2="95" stroke="#4f5660" stroke-width="7"/><ellipse cx="45" cy="94" rx="28" ry="9" class="sensor"/>
    <rect x="325" y="122" width="42" height="22" rx="5" class="sensor"/><line x1="346" y1="144" x2="346" y2="245" stroke="#4f5660" stroke-width="6"/>
    <text x="4" y="70" class="small">LiDAR scan plane ≈498 mm</text><text x="284" y="110" class="small">OAK-D ≈443 mm</text>
    <text x="142" y="240" class="small">basket wall top 250 mm</text>
    <text x="20" y="452" class="small">Όλοι οι drive τροχοί: ίδιος άξονας z=85 mm — επίπεδο σασί</text>
    <text x="20" y="477" class="small">Χωρίς caster και χωρίς pitched chassis</text>
  </g>

  <rect x="35" y="800" width="1530" height="145" rx="12" class="panel"/>
  <text x="65" y="840" class="h">Κατασκευαστική baseline</text>
  <rect x="65" y="862" width="345" height="58" rx="8" class="note"/><text x="82" y="886" class="label">Drive</text><text x="82" y="908" class="small">4× FIT0403, δύο παράλληλα ανά BTS7960</text>
  <rect x="430" y="862" width="345" height="58" rx="8" class="note"/><text x="447" y="886" class="label">Intake</text><text x="447" y="908" class="small">2× ανεξάρτητα μοτέρ, αντίθετη περιστροφή</text>
  <rect x="795" y="862" width="345" height="58" rx="8" class="note"/><text x="812" y="886" class="label">Storage</text><text x="812" y="908" class="small">βυθισμένο αφαιρούμενο basket v2.1</text>
  <rect x="1160" y="862" width="375" height="58" rx="8" class="danger"/><text x="1177" y="886" class="label">Πριν το τρύπημα</text><text x="1177" y="908" class="small">επιβεβαίωση πραγματικών motor mounts και clearances</text>
</svg>
