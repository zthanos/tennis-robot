services:
  otel-collector:
    image: otel/opentelemetry-collector:0.128.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - default
      - ros2-net

  sim-dev:
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - PYTHONPATH=/workspace
      - UV_PROJECT_ENVIRONMENT=/opt/tennis-robot-venv
      - UV_LINK_MODE=copy

  # ── Gazebo Harmonic simulation ───────────────────────────────────────────────
  # Start with: docker compose --profile gazebo up gazebo
  # From a WSL shell so /dev/dri and WSLg mounts are available.
  #
  # GPU check:  docker compose --profile gazebo run --rm gazebo glxinfo -B
  # Good output: "OpenGL renderer string: AMD Radeon RX ..."
  # Bad output:  "OpenGL renderer string: llvmpipe" → GPU not available
  gazebo:
    build:
      context: .
      dockerfile: Dockerfile.gazebo
    image: tennis-robot-gazebo
    working_dir: /ros2_ws
    shm_size: "2gb"
    # Headless by default: the WSLg GPU can't reliably render the Gazebo GUI
    # window (D3D12 device reset / Ogre out-of-memory). View in RViz instead
    # (rviz service below: docker compose --profile gazebo up gazebo rviz).
    # Set GAZEBO_HEADLESS=false to try the GUI.
    # One command brings up everything: sim + controllers + twist_mux + control
    # panel (sim.launch.py) and SLAM mapping (backgrounded), then the Nav2 core
    # (navigation.launch.py, foreground) so the navigate_to_pose action server is
    # up for collection lane navigation.
    # docker_dev_entry.sh first colcon-builds the mounted /workspace/ros2_ws as
    # an overlay (incremental, persisted in ros2_ws/{build,install}_docker) so
    # Python/launch edits only need `up`, not an image rebuild. Set
    # DEV_OVERLAY=false to run the image-baked install only.
    command:
      - bash
      - -lc
      - "bash /workspace/scripts/docker_dev_entry.sh"
    ports:
      - "8081:8081"   # web control panel
    devices:
      - /dev/dxg
    volumes:
      - .:/workspace
      - ./docker/ros2/cyclonedds-gazebo.xml:/cyclonedds-gazebo.xml:ro
      - /mnt/wslg:/mnt/wslg
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
    networks:
      - ros2-net
    environment:
      - DISPLAY=:0
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/mnt/wslg/runtime-dir
      - PULSE_SERVER=/mnt/wslg/PulseServer
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      - MESA_LOADER_DRIVER_OVERRIDE=d3d12
      # GPU (D3D12) only works for OFFSCREEN/EGL (headless sensors). Forcing
      # GALLIUM_DRIVER=d3d12 here breaks the GLX path used by the Gazebo/RViz GUI
      # on WSLg (drisw/GLXCreateNewContext fails). So it is set per-run only in
      # headless mode via GALLIUM_DRIVER below, not globally.
      - "GALLIUM_DRIVER=${GALLIUM_DRIVER:-}"
      # The discrete RX 7900 XTX is not enumerated inside the container; only the
      # integrated 890M is reachable via WSL. 890M is plenty for the sim.
      - "MESA_D3D12_DEFAULT_ADAPTER_NAME=${MESA_D3D12_DEFAULT_ADAPTER_NAME:-890M}"
      - LIBGL_ALWAYS_SOFTWARE=0
      - GZ_SIM_RESOURCE_PATH=/workspace/gazebo/models
      - ROS2_INSTALL=/ros2_ws/install
      - ROS_DOMAIN_ID=42
      # Fast DDS by default. Under rmw_cyclonedds_cpp the diff_drive_controller's
      # cmd_vel subscription inside the gz process silently never received
      # messages (matched at DDS level, visible to `ros2 topic echo`, but the
      # callback never fired) -> robot accepted Twist but never moved.
      # Verified 2026-06-12 via ~/cmd_vel_out A/B test; Fast DDS delivers fine.
      - "RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}"
      # UDP-only Fast DDS: SHM leaves stale /dev/shm locks after node crashes
      # ("Failed init_port ... open_and_lock_file failed" spam on restart).
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/docker/ros2/fastdds-no-shm.xml
      - CYCLONEDDS_URI=/cyclonedds-gazebo.xml
      - NAV2_START_DELAY_S=${NAV2_START_DELAY_S:-25}
      - GAZEBO_HEADLESS=${GAZEBO_HEADLESS:-true}
      - SLAM_MODE=${SLAM_MODE:-mapping}
      - DEV_OVERLAY=${DEV_OVERLAY:-true}
      - GAZEBO_GPU=${GAZEBO_GPU:-false}
      - ROBOT_COMMAND_FILE=/workspace/runtime/robot_command.json
      - COLLECTION_EVENT_LOG_FILE=/workspace/runtime/collection_events.jsonl
      - INTAKE_LIP_RAISE_M=${INTAKE_LIP_RAISE_M:-0.0}
      - INTAKE_ROLLER_X_OFFSET_M=${INTAKE_ROLLER_X_OFFSET_M:-0.0}
      - INTAKE_LIP_X_OFFSET_M=${INTAKE_LIP_X_OFFSET_M:-0.0}
      - INTAKE_ROLLER_Z_OFFSET_M=${INTAKE_ROLLER_Z_OFFSET_M:-0.0}
      # Dual-wheel intake (debug-log #41-#42). Fallbacks mirror the code
      # defaults in scripts/generate_robot_urdf.py; empty values would crash
      # the generator's float() parsing, so keep real numbers here.
      - INTAKE_WHEEL_RADIUS_M=${INTAKE_WHEEL_RADIUS_M:-0.060}
      - INTAKE_WHEEL_GAP_M=${INTAKE_WHEEL_GAP_M:-0.056}
      - INTAKE_NIP_X_M=${INTAKE_NIP_X_M:-0.540}
      - INTAKE_WHEEL_TILT_DEG=${INTAKE_WHEEL_TILT_DEG:-35.0}
      - INTAKE_WHEEL_SPRING_K=${INTAKE_WHEEL_SPRING_K:-1000}
      - INTAKE_ENABLE_FUNNEL=${INTAKE_ENABLE_FUNNEL:-true}
      - INTAKE_ENABLE_RAMP=${INTAKE_ENABLE_RAMP:-true}
      - INTAKE_RAMP_PROFILE=${INTAKE_RAMP_PROFILE:-launch}
      - INTAKE_RAMP_ENTRY_X_M=${INTAKE_RAMP_ENTRY_X_M:-0.540}
      - INTAKE_LAUNCH_EXIT_X_M=${INTAKE_LAUNCH_EXIT_X_M:-0.465}
      - INTAKE_LAUNCH_EXIT_Z_M=${INTAKE_LAUNCH_EXIT_Z_M:-0.032}
      - INTAKE_LAUNCH_EXIT_ANGLE_DEG=${INTAKE_LAUNCH_EXIT_ANGLE_DEG:-35.0}
      - INTAKE_RAMP_KNEE_X_M=${INTAKE_RAMP_KNEE_X_M:-0.465}
      - INTAKE_RAMP_KNEE_Z_M=${INTAKE_RAMP_KNEE_Z_M:-0.020}
      - INTAKE_RAMP_END_X_M=${INTAKE_RAMP_END_X_M:-0.425}
      - INTAKE_RAMP_END_Z_M=${INTAKE_RAMP_END_Z_M:-0.045}
      - INTAKE_LAUNCH_EXIT_X_M=${INTAKE_LAUNCH_EXIT_X_M:-0.465}
      - INTAKE_LAUNCH_EXIT_Z_M=${INTAKE_LAUNCH_EXIT_Z_M:-0.032}
      - INTAKE_LAUNCH_EXIT_ANGLE_DEG=${INTAKE_LAUNCH_EXIT_ANGLE_DEG:-35.0}
      - INTAKE_BASKET_FLOOR_FRONT_X_M=${INTAKE_BASKET_FLOOR_FRONT_X_M:-0.42}
      - INTAKE_BASKET_FLOOR_TOP_Z_M=${INTAKE_BASKET_FLOOR_TOP_Z_M:-0.025}
      - BASKET_CENTER_LIP_HEIGHT_M=${BASKET_CENTER_LIP_HEIGHT_M:-0.020}
      - ROBOT_MAX_WHEEL_SPEED_RAD_S=3.5
      - COLLECTOR_SCAN_ANGULAR_SPEED_RAD_S=0.35
      - COLLECTOR_MAX_ALIGN_ANGULAR_SPEED_RAD_S=0.45
      - COLLECTOR_ALIGN_ANGULAR_GAIN=1.4
      # Slightly faster bench/sim collection pass; still slow enough to see
      # the roller engagement in the RViz FrontFollow view.
      - COLLECTOR_APPROACH_SPEED_M_S=0.16
      - COLLECTOR_CAPTURE_SPEED_M_S=0.14
      - COLLECTOR_REVERSE_SPEED_M_S=0.08
      # Windows host bridge for the hardware-validated Arduino collector on COM8.
      - COLLECTOR_SERIAL_BRIDGE=${COLLECTOR_SERIAL_BRIDGE:-host.docker.internal:8091}
      - SURVEY_DRIVE_SPEED_M_S=0.24
      - SURVEY_TURN_SPEED_RAD_S=0.75
    profiles: ["gazebo"]

  # RViz2 — visualization for the running sim (map, TF, /scan, robot model).
  # Start alongside the sim:
  #   docker compose --profile gazebo up gazebo rviz
  # Or attach later to an already-running sim:
  #   docker compose --profile gazebo up rviz
  rviz:
    image: tennis-robot-gazebo
    build:
      context: .
      dockerfile: Dockerfile.gazebo
    command:
      - bash
      - -lc
      # Source the dev overlay built by the gazebo container (shared /workspace
      # mount) so package://tennis_robot meshes added after the image build
      # still resolve in RViz.
      - ". /opt/ros/humble/setup.sh; . /ros2_ws/install/setup.sh; [ -f /workspace/ros2_ws/install_docker/local_setup.sh ] && . /workspace/ros2_ws/install_docker/local_setup.sh; rviz2 -d /workspace/docker/ros2/tennis_robot.rviz"
    devices:
      - /dev/dxg
    volumes:
      - .:/workspace
      - ./docker/ros2/cyclonedds-gazebo.xml:/cyclonedds-gazebo.xml:ro
      - /mnt/wslg:/mnt/wslg
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
    networks:
      - ros2-net
    environment:
      - DISPLAY=:0
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/mnt/wslg/runtime-dir
      - PULSE_SERVER=/mnt/wslg/PulseServer
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      # RViz is a GLX GUI: the d3d12 Mesa driver crashes on the GLX path
      # (segfault/exit 139), so NEVER inherit GALLIUM_DRIVER here — even when
      # the sim runs headless with GPU. RViz always renders in software.
      - MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
      - GALLIUM_DRIVER=
      - LIBGL_ALWAYS_SOFTWARE=1
      - ROS_DOMAIN_ID=42
      - "RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}"
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/docker/ros2/fastdds-no-shm.xml
      - CYCLONEDDS_URI=/cyclonedds-gazebo.xml
    profiles: ["gazebo", "gazebo-rec"]

  # Gazebo with survey replay recorder enabled.
  # Start with:
  #   docker compose --profile gazebo-rec build gazebo-rec
  #   docker compose --profile gazebo-rec up gazebo-rec
  #
  # The recorder writes runtime/survey_replay_latest.jsonl while Map Court runs.
  gazebo-rec:
    build:
      context: .
      dockerfile: Dockerfile.gazebo
    working_dir: /ros2_ws
    shm_size: "2gb"
    ports:
      - "8081:8081"   # web control panel
    devices:
      - /dev/dxg
    volumes:
      - .:/workspace
      - ./docker/ros2/cyclonedds-gazebo.xml:/cyclonedds-gazebo.xml:ro
      - /mnt/wslg:/mnt/wslg
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
    networks:
      - ros2-net
    environment:
      - DISPLAY=:0
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/mnt/wslg/runtime-dir
      - PULSE_SERVER=/mnt/wslg/PulseServer
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      - MESA_LOADER_DRIVER_OVERRIDE=d3d12
      # GPU (D3D12) only works for OFFSCREEN/EGL (headless sensors). Forcing
      # GALLIUM_DRIVER=d3d12 here breaks the GLX path used by the Gazebo/RViz GUI
      # on WSLg (drisw/GLXCreateNewContext fails). So it is set per-run only in
      # headless mode via GALLIUM_DRIVER below, not globally.
      - "GALLIUM_DRIVER=${GALLIUM_DRIVER:-}"
      # The discrete RX 7900 XTX is not enumerated inside the container; only the
      # integrated 890M is reachable via WSL. 890M is plenty for the sim.
      - "MESA_D3D12_DEFAULT_ADAPTER_NAME=${MESA_D3D12_DEFAULT_ADAPTER_NAME:-890M}"
      - LIBGL_ALWAYS_SOFTWARE=0
      - GZ_SIM_RESOURCE_PATH=/workspace/gazebo/models
      - ROS2_INSTALL=/ros2_ws/install
      - ROS_DOMAIN_ID=42
      - "RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}"
      - CYCLONEDDS_URI=/cyclonedds-gazebo.xml
      - ROBOT_COMMAND_FILE=/workspace/runtime/robot_command.json
      - INTAKE_LIP_RAISE_M=${INTAKE_LIP_RAISE_M:-0.0}
      - INTAKE_ROLLER_X_OFFSET_M=${INTAKE_ROLLER_X_OFFSET_M:-0.0}
      - INTAKE_LIP_X_OFFSET_M=${INTAKE_LIP_X_OFFSET_M:-0.0}
      - INTAKE_ROLLER_Z_OFFSET_M=${INTAKE_ROLLER_Z_OFFSET_M:-0.0}
      # Dual-wheel intake (debug-log #41-#42). Fallbacks mirror the code
      # defaults in scripts/generate_robot_urdf.py; empty values would crash
      # the generator's float() parsing, so keep real numbers here.
      - INTAKE_WHEEL_RADIUS_M=${INTAKE_WHEEL_RADIUS_M:-0.060}
      - INTAKE_WHEEL_GAP_M=${INTAKE_WHEEL_GAP_M:-0.056}
      - INTAKE_NIP_X_M=${INTAKE_NIP_X_M:-0.540}
      - INTAKE_WHEEL_TILT_DEG=${INTAKE_WHEEL_TILT_DEG:-35.0}
      - INTAKE_WHEEL_SPRING_K=${INTAKE_WHEEL_SPRING_K:-1000}
      - INTAKE_ENABLE_FUNNEL=${INTAKE_ENABLE_FUNNEL:-true}
      - INTAKE_ENABLE_RAMP=${INTAKE_ENABLE_RAMP:-true}
      - INTAKE_RAMP_ENTRY_X_M=${INTAKE_RAMP_ENTRY_X_M:-0.500}
      - INTAKE_RAMP_KNEE_X_M=${INTAKE_RAMP_KNEE_X_M:-0.465}
      - INTAKE_RAMP_KNEE_Z_M=${INTAKE_RAMP_KNEE_Z_M:-0.020}
      - INTAKE_RAMP_END_X_M=${INTAKE_RAMP_END_X_M:-0.425}
      - INTAKE_RAMP_END_Z_M=${INTAKE_RAMP_END_Z_M:-0.045}
      - INTAKE_BASKET_FLOOR_FRONT_X_M=${INTAKE_BASKET_FLOOR_FRONT_X_M:-0.42}
      - INTAKE_BASKET_FLOOR_TOP_Z_M=${INTAKE_BASKET_FLOOR_TOP_Z_M:-0.025}
      - BASKET_CENTER_LIP_HEIGHT_M=${BASKET_CENTER_LIP_HEIGHT_M:-0.020}
      - ROBOT_MAX_WHEEL_SPEED_RAD_S=3.5
      - COLLECTOR_SCAN_ANGULAR_SPEED_RAD_S=0.35
      - COLLECTOR_MAX_ALIGN_ANGULAR_SPEED_RAD_S=0.45
      - COLLECTOR_ALIGN_ANGULAR_GAIN=1.4
      - COLLECTOR_APPROACH_SPEED_M_S=0.12
      - COLLECTOR_CAPTURE_SPEED_M_S=0.14
      - COLLECTOR_REVERSE_SPEED_M_S=0.08
      - SURVEY_DRIVE_SPEED_M_S=0.24
      - SURVEY_TURN_SPEED_RAD_S=0.75
      - ROS2_SURVEY_DRIVE_SPEED_M_S=0.75
      - ROS2_SURVEY_TURN_SPEED_RAD_S=0.85
      - SURVEY_REPLAY_DURATION_S=1200
      - SURVEY_REPLAY_FILE=/workspace/runtime/survey_replay_latest.jsonl
      - GAZEBO_HEADLESS=${GAZEBO_HEADLESS:-false}
    command: ["bash", "-c", ". /opt/ros/humble/setup.sh && . /ros2_ws/install/setup.sh && mkdir -p /workspace/runtime && (python3 /workspace/scripts/survey_replay_record.py --out $${SURVEY_REPLAY_FILE} --duration-s $${SURVEY_REPLAY_DURATION_S} > /workspace/runtime/survey_replay_record.out.log 2> /workspace/runtime/survey_replay_record.err.log &) && ros2 launch tennis_robot sim.launch.py headless:=$${GAZEBO_HEADLESS:-false}"]
    profiles: ["gazebo-rec"]

  foxglove:
    image: tennis-robot-gazebo
    build:
      context: .
      dockerfile: Dockerfile.gazebo
    command:
      - bash
      - -lc
      - ". /opt/ros/humble/setup.sh; . /ros2_ws/install/setup.sh; ros2 launch foxglove_bridge foxglove_bridge_launch.xml port:=8765"
    ports:
      - "8765:8765"
    volumes:
      - ./docker/ros2/cyclonedds-gazebo.xml:/cyclonedds-gazebo.xml:ro
    networks:
      - ros2-net
    environment:
      - ROS_DOMAIN_ID=42
      - "RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}"
      - CYCLONEDDS_URI=/cyclonedds-gazebo.xml
    profiles: ["gazebo", "gazebo-rec"]

  openscad:
    image: openscad/openscad:bookworm
    profiles: ["cad"]
    working_dir: /workspace
    volumes:
      - .:/workspace

  openscad-gui:
    build:
      context: .
      dockerfile: Dockerfile.openscad
    profiles: ["cad"]
    working_dir: /workspace
    ports:
      - "6081:6080"
      - "5901:5900"
    shm_size: "512mb"
    environment:
      - DISPLAY_SIZE=1280x800x24
    volumes:
      - .:/workspace

networks:
  ros2-net:
    driver: bridge
