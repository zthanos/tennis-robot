# PC-side distributed-simulation boundary.
#
# Gazebo, robot abstraction and perception run locally in domain 41. Only this
# bridge joins LAN domain 42, so local ROS participants do not advertise or
# exchange discovery traffic through the mesh satellite.
name: tennis_pc41_lan42_bridge
from_domain: 41
to_domain: 42
topics:
  # PC local -> LAN: simulation time and stable sensor/perception contracts.
  /clock:
    type: rosgraph_msgs/msg/Clock
  /scan:
    type: sensor_msgs/msg/LaserScan
  /odometry/filtered:
    type: nav_msgs/msg/Odometry
  /tf:
    type: tf2_msgs/msg/TFMessage
  /tf_static:
    type: tf2_msgs/msg/TFMessage
    qos:
      reliability: reliable
      durability: transient_local
  /perception/ball_detections:
    type: tennis_robot_msgs/msg/BallDetectionArray
  /perception/diagnostics:
    type: std_msgs/msg/String
  /survey/vision:
    type: std_msgs/msg/String
  /ir/readings:
    type: tennis_robot_msgs/msg/IrReadings
  /collector/intake_beam_broken:
    type: std_msgs/msg/Bool
  /sim/balls:
    type: std_msgs/msg/String
  /sim/robot_true_pose:
    type: std_msgs/msg/String
  /telemetry/sensor_snapshot:
    type: std_msgs/msg/String
    qos:
      reliability: best_effort

  # LAN -> PC local: actuator commands only.
  /cmd_vel_nav:
    type: geometry_msgs/msg/TwistStamped
    reversed: true
  /cmd_vel_collection:
    type: geometry_msgs/msg/Twist
    reversed: true
  /cmd_vel_teleop:
    type: geometry_msgs/msg/Twist
    reversed: true
  /collector/cmd:
    type: tennis_robot_msgs/msg/CollectorCmd
    reversed: true
  /ball/collected:
    type: std_msgs/msg/String
    reversed: true
