# ros_gz_bridge parameter bridge config
# Bridges Gazebo Harmonic topics ↔ ROS 2 Humble topics.
# Used by: ros2 run ros_gz_bridge parameter_bridge --ros-args -p config_file:=/workspace/gazebo/bridge_config.yaml

# Simulation clock — REQUIRED for use_sim_time nodes (slam_toolbox, Nav2).
# Without it, sim time never starts and TF (map->odom) is never published.
- gz_topic_name: /clock
  ros_topic_name: /clock
  gz_type_name: gz.msgs.Clock
  ros_type_name: rosgraph_msgs/msg/Clock
  direction: GZ_TO_ROS

- gz_topic_name: /gz/lidar
  ros_topic_name: /scan
  gz_type_name: gz.msgs.LaserScan
  ros_type_name: sensor_msgs/msg/LaserScan
  direction: GZ_TO_ROS

- gz_topic_name: /gz/imu
  ros_topic_name: /imu/data
  gz_type_name: gz.msgs.IMU
  ros_type_name: sensor_msgs/msg/Imu
  direction: GZ_TO_ROS

- gz_topic_name: /odom
  ros_topic_name: /odom
  gz_type_name: gz.msgs.Odometry
  ros_type_name: nav_msgs/msg/Odometry
  direction: GZ_TO_ROS

- gz_topic_name: /tf
  ros_topic_name: /tf
  gz_type_name: gz.msgs.Pose_V
  ros_type_name: tf2_msgs/msg/TFMessage
  direction: GZ_TO_ROS

- gz_topic_name: /cmd_vel
  ros_topic_name: /cmd_vel
  gz_type_name: gz.msgs.Twist
  ros_type_name: geometry_msgs/msg/Twist
  direction: ROS_TO_GZ

- gz_topic_name: /gz/camera
  ros_topic_name: /camera/image_raw
  gz_type_name: gz.msgs.Image
  ros_type_name: sensor_msgs/msg/Image
  direction: GZ_TO_ROS

# Sim-only debug camera watching the roller/lip contact zone (intake tuning
# aid) — see intake_debug_camera.urdf.xacro.
- gz_topic_name: /gz/intake_debug_camera
  ros_topic_name: /camera/intake_debug/image_raw
  gz_type_name: gz.msgs.Image
  ros_type_name: sensor_msgs/msg/Image
  direction: GZ_TO_ROS

- gz_topic_name: /gz/intake_debug_depth
  ros_topic_name: /camera/intake_debug/depth
  gz_type_name: gz.msgs.Image
  ros_type_name: sensor_msgs/msg/Image
  direction: GZ_TO_ROS

- gz_topic_name: /gz/depth
  ros_topic_name: /camera/depth
  gz_type_name: gz.msgs.Image
  ros_type_name: sensor_msgs/msg/Image
  direction: GZ_TO_ROS

- gz_topic_name: /gz/ir_left
  ros_topic_name: /gz/ir_left/scan
  gz_type_name: gz.msgs.LaserScan
  ros_type_name: sensor_msgs/msg/LaserScan
  direction: GZ_TO_ROS

- gz_topic_name: /gz/ir_right
  ros_topic_name: /gz/ir_right/scan
  gz_type_name: gz.msgs.LaserScan
  ros_type_name: sensor_msgs/msg/LaserScan
  direction: GZ_TO_ROS

- gz_topic_name: /gz/basket_ir_left
  ros_topic_name: /gz/basket_ir_left/scan
  gz_type_name: gz.msgs.LaserScan
  ros_type_name: sensor_msgs/msg/LaserScan
  direction: GZ_TO_ROS

- gz_topic_name: /gz/basket_ir_right
  ros_topic_name: /gz/basket_ir_right/scan
  gz_type_name: gz.msgs.LaserScan
  ros_type_name: sensor_msgs/msg/LaserScan
  direction: GZ_TO_ROS

# World pose info — used by gazebo_extras_node to track ball positions
- gz_topic_name: /world/tennis_court/pose/info
  ros_topic_name: /gz/pose_info
  gz_type_name: gz.msgs.Pose_V
  ros_type_name: tf2_msgs/msg/TFMessage
  direction: GZ_TO_ROS

# Real physics contact from each intake wheel (dual-wheel side pinch:
# 0 = left, 1 = right).
- gz_topic_name: /world/tennis_court/model/tennis_robot/link/intake_wheel_left_link/sensor/roller_contact_0/contact
  ros_topic_name: /gz/roller_contact_0
  gz_type_name: gz.msgs.Contacts
  ros_type_name: ros_gz_interfaces/msg/Contacts
  direction: GZ_TO_ROS
- gz_topic_name: /world/tennis_court/model/tennis_robot/link/intake_wheel_right_link/sensor/roller_contact_1/contact
  ros_topic_name: /gz/roller_contact_1
  gz_type_name: gz.msgs.Contacts
  ros_type_name: ros_gz_interfaces/msg/Contacts
  direction: GZ_TO_ROS

# Real physics contact from the elevation ramp (guide contact).
- gz_topic_name: /world/tennis_court/model/tennis_robot/link/base_footprint/sensor/lip_contact_0/contact
  ros_topic_name: /gz/lip_contact_0
  gz_type_name: gz.msgs.Contacts
  ros_type_name: ros_gz_interfaces/msg/Contacts
  direction: GZ_TO_ROS
