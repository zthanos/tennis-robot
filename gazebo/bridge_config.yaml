# ros_gz_bridge parameter bridge config
# Bridges Gazebo Harmonic topics ↔ ROS 2 Humble topics.
# Used by: ros2 run ros_gz_bridge parameter_bridge --ros-args -p config_file:=/workspace/gazebo/bridge_config.yaml

# Simulation clock — REQUIRED for use_sim_time nodes (slam_toolbox, Nav2).
# Without it, sim time never starts and TF (map->odom) is never published.
- gz_topic_name: /clock
  ros_topic_name: /clock
  gz_type_name: gz.msgs.Clock
  ros_type_name: rosgraph_msgs/msg/Clock
  direction: GZ_TO_ROS

- gz_topic_name: /gz/lidar
  ros_topic_name: /scan
  gz_type_name: gz.msgs.LaserScan
  ros_type_name: sensor_msgs/msg/LaserScan
  direction: GZ_TO_ROS

- gz_topic_name: /odom
  ros_topic_name: /odom
  gz_type_name: gz.msgs.Odometry
  ros_type_name: nav_msgs/msg/Odometry
  direction: GZ_TO_ROS

- gz_topic_name: /tf
  ros_topic_name: /tf
  gz_type_name: gz.msgs.Pose_V
  ros_type_name: tf2_msgs/msg/TFMessage
  direction: GZ_TO_ROS

- gz_topic_name: /cmd_vel
  ros_topic_name: /cmd_vel
  gz_type_name: gz.msgs.Twist
  ros_type_name: geometry_msgs/msg/Twist
  direction: ROS_TO_GZ

- gz_topic_name: /gz/camera
  ros_topic_name: /camera/image_raw
  gz_type_name: gz.msgs.Image
  ros_type_name: sensor_msgs/msg/Image
  direction: GZ_TO_ROS

- gz_topic_name: /gz/depth
  ros_topic_name: /camera/depth
  gz_type_name: gz.msgs.Image
  ros_type_name: sensor_msgs/msg/Image
  direction: GZ_TO_ROS

- gz_topic_name: /gz/ir_left
  ros_topic_name: /gz/ir_left/scan
  gz_type_name: gz.msgs.LaserScan
  ros_type_name: sensor_msgs/msg/LaserScan
  direction: GZ_TO_ROS

- gz_topic_name: /gz/ir_right
  ros_topic_name: /gz/ir_right/scan
  gz_type_name: gz.msgs.LaserScan
  ros_type_name: sensor_msgs/msg/LaserScan
  direction: GZ_TO_ROS

- gz_topic_name: /gz/basket_ir_left
  ros_topic_name: /gz/basket_ir_left/scan
  gz_type_name: gz.msgs.LaserScan
  ros_type_name: sensor_msgs/msg/LaserScan
  direction: GZ_TO_ROS

- gz_topic_name: /gz/basket_ir_right
  ros_topic_name: /gz/basket_ir_right/scan
  gz_type_name: gz.msgs.LaserScan
  ros_type_name: 