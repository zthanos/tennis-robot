        <div class="workspace collection-workspace">
          <div class="workspace-main panel map-panel">
            <h3>Collection Map</h3>
            <canvas id="courtMap" class="court-map" width="1200" height="600"></canvas>
            <div class="legend">
              <span>Confirmed ball</span>
              <span class="depth">OAK depth</span>
              <span class="pending">Pending</span>
              <span class="across">Across net</span>
              <span class="lane">Identified lanes</span>
              <span class="route">Planned route</span>
              <span class="robot">Robot</span>
              <span class="camball">Cam ball</span>
              <span class="goal">Nav goal</span>
              <span class="fov">Camera FOV</span>
            </div>
          </div>
          <div class="workspace-side">
            <div class="panel">
              <h3>Controls</h3>
              <div class="collection-route-actions">
                <button class="command" type="button" data-command-mode="collect_route">Collect Route</button>
                <button class="command" type="button" data-command-mode="idle" value="idle">Stop</button>
              </div>
            </div>
            <div class="panel">
              <h3>Collection Run <span id="collectionRunStatus">waiting</span></h3>
              <div id="collectionRunKv" class="kv"></div>
            </div>
            <div class="panel">
              <h3>Intake Transfer <span id="collIrStatus">waiting</span></h3>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div id="collIrEntryPanel" style="padding:12px;border-radius:8px;border:1px solid var(--line);">
                  <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">ENTRY SENSOR</div>
                  <div id="collIrEntryValue" style="font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;">-</div>
                  <div id="collIrEntryLast" style="margin-top:4px;font-size:12px;color:var(--muted);">No entry seen</div>
                  <div style="margin-top:8px;height:8px;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden;">
                    <div id="collIrEntryBar" style="height:100%;width:0%;border-radius:4px;transition:width 0.15s,background 0.15s;"></div>
                  </div>
                </div>
                <div id="collIrConfirmedPanel" style="padding:12px;border-radius:8px;border:1px solid var(--line);">
                  <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">CONFIRMED SENSOR</div>
                  <div id="collIrConfirmedValue" style="font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;">-</div>
                  <div id="collIrConfirmedLast" style="margin-top:4px;font-size:12px;color:var(--muted);">No confirmation seen</div>
                  <div style="margin-top:8px;height:8px;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden;">
                    <div id="collIrConfirmedBar" style="height:100%;width:0%;border-radius:4px;transition:width 0.15s,background 0.15s;"></div>
                  </div>
                </div>
              </div>
              <div id="collIrBadge" style="margin-top:12px;padding:8px 14px;border-radius:6px;font-size:13px;font-weight:600;text-align:center;background:rgba(255,255,255,0.04);color:var(--muted);">
                WAITING FOR SIGNAL
              </div>
            </div>
          </div>
        </div>
        <div class="panel collection-terminal-panel collection-log-full">
          <div class="collection-log-head">
            <h3>Collection Log <span id="collectionLogStatus">waiting</span></h3>
            <div style="display:flex;gap:8px;align-items:center;">
              <button id="collectionLogCopy" class="secondary-action" type="button">Copy</button>
              <button id="collectionLogClear" class="secondary-action" type="button">Clear</button>
            </div>
          </div>
          <div id="collectionTerminalLog" class="terminal-log"></div>
        </div>
