        <div class="command-center">
          <div class="panel">
            <h3>Mode Command</h3>
            <form id="commandForm" class="controls">
              <div class="dpad">
                <button class="command dpad-ul" type="button" name="mode" value="move_forward_left">&#8598;</button>
                <button class="command dpad-up" type="button" name="mode" value="move_forward">&#9650;</button>
                <button class="command dpad-ur" type="button" name="mode" value="move_forward_right">&#8599;</button>
                <button class="command dpad-left" type="button" name="mode" value="move_left">&#9664;</button>
                <button class="command dpad-center" type="button" name="mode" value="turn_180">180°</button>
                <button class="command dpad-right" type="button" name="mode" value="move_right">&#9654;</button>
                <button class="command dpad-dl" type="button" name="mode" value="move_backward_left">&#8601;</button>
                <button class="command dpad-down" type="button" name="mode" value="move_backward">&#9660;</button>
                <button class="command dpad-dr" type="button" name="mode" value="move_backward_right">&#8600;</button>
              </div>
              <div class="mission-btns">
                <button class="command" type="button" name="mode" value="map_court">Map Court</button>
                <button class="command" type="button" name="mode" value="collect_route">Collect Route</button>
                <button class="command" type="button" name="mode" value="idle">Stop</button>
              </div>
            </form>
            <div id="commandHint" style="font-size:12px;color:var(--warn);margin-top:8px;min-height:16px;"></div>
          </div>
          <div class="panel">
            <h3>Selected Mode</h3>
            <div id="selectedMode" class="kv"></div>
          </div>
        </div>
